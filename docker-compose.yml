# ─────────────────────────────────────────────────────────────────────────────
# Universal Data Connector — full stack (postgres + backend + frontend + airflow)
# Run:  docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ═══════════════════════════════════════════════════════════════════════════
  # Postgres — shared by the API and Airflow
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:13
    container_name: data_connector_postgres
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
      TZ: Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # host 5433 → container 5432 (host 5432 is taken by a local Postgres)
      - "5433:5432"
    networks:
      - connector_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Backend — FastAPI (built from ./backend/Dockerfile)
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: data_connector_backend:latest
    container_name: data_connector_backend
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Kolkata
      DB_HOST: postgres   # service name on the docker network
      DB_PORT: "5432"     # internal port, not the host-mapped 5433
    volumes:
      - dags_volume:/app/dags
      - ./data:/app/data
      - ./Dataset:/app/dataset
      - ${WINDOWS_DOWNLOADS:-./data/uploads}:/app/uploads
      - ${WINDOWS_DOCUMENTS:-./Dataset}:/opt/airflow/dataset_win
      - ./backend:/app/current_dir
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - connector_net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Frontend — React (built from ./frontend/Dockerfile, served by nginx)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: data_connector_frontend:latest
    container_name: data_connector_frontend
    ports:
      # host 3001 → container 80 (host 3000 is taken by another app)
      - "3001:80"
    environment:
      TZ: Asia/Kolkata
    depends_on:
      - backend
    networks:
      - connector_net
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Airflow — init / webserver / scheduler
  # ═══════════════════════════════════════════════════════════════════════════
  airflow-init:
    image: apache/airflow:2.7.0
    container_name: airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      AIRFLOW__API__AUTH_BACKENDS:         airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${AIRFLOW__WEBSERVER__SECRET_KEY}
      TZ: Asia/Kolkata
    command: >
      bash -c "airflow db migrate && airflow users create
      --username admin --password admin
      --firstname admin --lastname admin
      --role Admin --email admin@example.com"
    networks:
      - connector_net

  airflow-webserver:
    image: apache/airflow:2.7.0
    container_name: airflow_webserver
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - dags_volume:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./Dataset:/opt/airflow/dataset
      - airflow_logs:/opt/airflow/logs
      - ${WINDOWS_DOCUMENTS:-./Dataset}:/opt/airflow/dataset_win
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      AIRFLOW__API__AUTH_BACKENDS:         airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${AIRFLOW__WEBSERVER__SECRET_KEY}
      _PIP_ADDITIONAL_REQUIREMENTS:        "boto3 polars openpyxl pandas"
      AWS_ACCESS_KEY_ID:                   ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY:               ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION:                          ${AWS_REGION}
      TZ: Asia/Kolkata
    command: webserver
    networks:
      - connector_net
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.7.0
    container_name: airflow_scheduler
    env_file:
      - .env
    volumes:
      - dags_volume:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./Dataset:/opt/airflow/dataset
      - airflow_logs:/opt/airflow/logs
      - ${WINDOWS_DOCUMENTS:-./Dataset}:/opt/airflow/dataset_win
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      AIRFLOW__API__AUTH_BACKENDS:         airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${AIRFLOW__WEBSERVER__SECRET_KEY}
      _PIP_ADDITIONAL_REQUIREMENTS:        "boto3 polars openpyxl pandas"
      AWS_ACCESS_KEY_ID:                   ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY:               ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION:                          ${AWS_REGION}
      TZ: Asia/Kolkata
    command: scheduler
    networks:
      - connector_net
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
  dags_volume:

networks:
  connector_net:
    driver: bridge